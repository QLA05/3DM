<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>骨骼3D预览(DICOM重建)</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{display:flex;height:100vh;font-family:system-ui;}
        #ui-panel{width:320px;padding:12px;background:#f4f4f4;overflow:auto;}
        #viewer-container{flex:1;position:relative;background:#eee;}
        .btn{padding:8px 12px;margin:4px;border:none;border-radius:4px;color:white;font-size:14px;cursor:pointer;}
        .green{background:#28a745;}
        .blue{background:#007bff;}
        .cyan{background:#17a2b8;}
        .orange{background:#fd7e14;}
        .purple{background:#6f42c1;}
        .control-block{margin:12px 0;padding:10px;background:white;border-radius:6px;}
        input[type="range"]{width:100%;}
    </style>
</head>
<body>
<div id="ui-panel">
    <input type="file" id="file-input" multiple accept=".dcm" style="display:none;">
    <button class="btn green" id="btn-upload">上传DICOM(.dcm)序列</button>

    <div>
        <button class="btn blue" id="btn-reset">复位视角</button>
        <button class="btn cyan" id="btn-hide">隐藏</button>
        <button class="btn orange" id="btn-rotate">旋转</button>
        <button class="btn purple" id="btn-qrcode">生成访问二维码</button>
        <button class="btn orange" id="btn-anim">播放动画</button>
    </div>

    <div class="control-block">
        <div>等值面HU阈值:<span id="hu-val">176</span></div>
        <input type="range" id="hu-slider" min="100" max="1200" value="176">
        <button class="btn blue" id="rebuildIsoBtn">重新重建</button>
        <div id="status-text">等待上传DICOM</div>
        <div id="log-text" style="margin-top:8px;font-size:12px;color:#666;max-height:140px;overflow:auto;"></div>
    </div>
</div>
<div id="viewer-container"></div>

<script src="https://cdn.jsdelivr.net/npm/dicom-parser@1.8.21/dist/dicomParser.min.js"></script>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { MarchingCubes } from 'three/addons/objects/MarchingCubes.js';

let scene, camera, renderer, controls;
let dicomVolume = null;
let volumeMesh = null;
let rotateAnim = false;
let pixelSpacing = [1.0,1.0];
let sliceThickness = 1.0;

const statusText = document.getElementById('status-text');
const logText = document.getElementById('log-text');
const huSlider = document.getElementById('hu-slider');
const huValSpan = document.getElementById('hu-val');
const fileInput = document.getElementById('file-input');
const btnUpload = document.getElementById('btn-upload');

btnUpload.onclick = ()=> fileInput.click();
huSlider.oninput = ()=>huValSpan.innerText = huSlider.value;

document.getElementById('rebuildIsoBtn').onclick = async ()=>{
    if(!dicomVolume){alert("请先上传DICOM序列");return;}
    statusText.innerText = "正在执行Marching‑Cubes平滑重建";
    const isoThresh = Number(huSlider.value);
    if(volumeMesh) scene.remove(volumeMesh);

    const {width,height,depth,data} = dicomVolume;
    const mc = new MarchingCubes(width, height, depth, null, false, false);
    // 填充体素数据
    for(let z=0;z<depth;z++){
        for(let y=0;y<height;y++){
            for(let x=0;x<width;x++){
                const idx = z*width*height + y*width + x;
                mc.setVoxel(x,y,z, data[idx] > isoThresh ? 1.0 : 0.0);
            }
        }
    }
    mc.update();
    volumeMesh = mc;

    volumeMesh.scale.set(pixelSpacing[0], pixelSpacing[1], sliceThickness);
    volumeMesh.geometry.computeBoundingBox();
    volumeMesh.geometry.computeBoundingSphere();
    const box = volumeMesh.geometry.boundingBox;
    const center = new THREE.Vector3();
    box.getCenter(center);
    volumeMesh.position.copy(center).multiplyScalar(-1);

    const mat = new THREE.MeshPhongMaterial({color:0xdddddd});
    volumeMesh.material = mat;
    scene.add(volumeMesh);

    const vertCount = volumeMesh.geometry.attributes.position?.count ?? 0;
    statusText.innerText = `重建完成，顶点:${vertCount}`;
    console.log("顶点数量:",vertCount);

    const sphere = volumeMesh.geometry.boundingSphere;
    const radius = sphere.radius * Math.max(pixelSpacing[0],pixelSpacing[1],sliceThickness);
    camera.position.set(radius*1.5, radius*1.5, radius*1.5);
    controls.target.set(0,0,0);
    controls.update();
};

document.getElementById('btn-reset').onclick = ()=>{
    if(volumeMesh){
        const sphere = volumeMesh.geometry.boundingSphere;
        const radius = sphere.radius * Math.max(pixelSpacing[0],pixelSpacing[1],sliceThickness);
        camera.position.set(radius*1.5, radius*1.5, radius*1.5);
        controls.target.set(0,0,0);
    }else{
        camera.position.set(300,300,400);
    }
    controls.update();
};
document.getElementById('btn-hide').onclick = ()=>{
    if(volumeMesh) volumeMesh.visible = !volumeMesh.visible;
};
document.getElementById('btn-rotate').onclick = ()=> rotateAnim = !rotateAnim;

fileInput.onchange = async (e)=>{
    statusText.innerText = "正在解析DICOM...";
    const files = Array.from(e.target.files);
    logText.innerText='';
    const sliceList = [];
    let dimX=null,dimY=null;

    for(const f of files){
        try{
            const arrayBuf = await f.arrayBuffer();
            const byteArray = new Uint8Array(arrayBuf);
            const dataSet = dicomParser.parseDicom(byteArray);

            const rows = dataSet.uint16('x00280010');
            const cols = dataSet.uint16('x00280011');
            const pixelDataElement = dataSet.elements.x7fe00010;

            if(!rows || !cols || !pixelDataElement || !pixelDataElement.length){
                logText.innerText += `跳过:${f.name} 无像素\n`;
                continue;
            }
            dimX = cols;
            dimY = rows;

            const spacingStr = dataSet.string('x00280030');
            if(spacingStr){
                const sp = spacingStr.split('\\').map(Number);
                pixelSpacing[0]=sp[0];pixelSpacing[1]=sp[1];
            }
            const thick = dataSet.floatString('x00180050');
            if(thick) sliceThickness=thick;

            const pixelBuffer = new Uint16Array(
                byteArray.buffer,
                pixelDataElement.dataOffset,
                pixelDataElement.length / 2
            );

            const slope = dataSet.floatString('x00281053') ?? 1.0;
            const intercept = dataSet.floatString('x00281052') ?? 0.0;
            const huArr = new Float32Array(pixelBuffer.length);
            for(let i=0;i<pixelBuffer.length;i++){
                huArr[i] = pixelBuffer[i] * slope + intercept;
            }

            const posZ = dataSet.floatString('x00200032',2) ?? sliceList.length;
            sliceList.push({
                posZ: posZ,
                huData: huArr
            });
        }catch(err){
            logText.innerText += `文件解析失败:${f.name}\n`;
            console.warn('文件解析失败',f.name,err);
        }
    }

    if(sliceList.length===0){
        statusText.innerText = "没有读到有效DICOM图像！";
        alert("选中的文件全部不含像素图像，请选择CT切片dcm");
        return;
    }
    sliceList.sort((a,b)=> a.posZ - b.posZ);
    const totalVoxels = dimX * dimY * sliceList.length;
    const volumeData = new Float32Array(totalVoxels);
    for(let z=0; z<sliceList.length; z++){
        const slice = sliceList[z];
        volumeData.set(slice.huData, z * dimX * dimY);
    }
    dicomVolume = {
        data: volumeData,
        width: dimX,
        height: dimY,
        depth: sliceList.length
    };
    statusText.innerText = `加载完成: ${dimX}×${dimY}×${sliceList.length}`;
};

function initThree(){
    const container = document.getElementById('viewer-container');
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0xeeeeee);
    camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1,20000);
    camera.position.set(300,300,400);
    renderer = new THREE.WebGLRenderer({antialias:true});
    renderer.setSize(container.clientWidth, container.clientHeight);
    container.appendChild(renderer.domElement);
    controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    const light1 = new THREE.DirectionalLight(0xffffff, 1);
    light1.position.set(200,200,200);
    scene.add(light1);
    scene.add(new THREE.AmbientLight(0xffffff,0.6));
    window.addEventListener('resize',()=>{
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
    });
    function animate(){
        requestAnimationFrame(animate);
        if(rotateAnim && volumeMesh) volumeMesh.rotation.y +=0.005;
        controls.update();
        renderer.render(scene,camera);
    }
    animate();
}

initThree();
console.log("✅ dicom‑parser已加载");
</script>
</body>
</html>
