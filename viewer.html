<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>骨骼3D预览(DICOM重建)</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{display:flex;height:100vh;font-family:system-ui;}
        #ui-panel{width:320px;padding:12px;background:#f4f4f4;overflow:auto;}
        #viewer-container{flex:1;position:relative;background:#eee;}
        .btn{padding:8px 12px;margin:4px;border:none;border-radius:4px;color:white;font-size:14px;cursor:pointer;}
        .green{background:#28a745;}
        .blue{background:#007bff;}
        .cyan{background:#17a2b8;}
        .orange{background:#fd7e14;}
        .purple{background:#6f42c1;}
        .red{background:#dc3545;}
        .control-block{margin:12px 0;padding:10px;background:white;border-radius:6px;}
        input[type="range"]{width:100%;}
    </style>
</head>
<body>
<div id="ui-panel">
    <input type="file" id="file-input" multiple accept=".dcm" style="display:none;">
    <button class="btn green" id="btn-upload">上传DICOM(.dcm)序列</button>

    <div>
        <button class="btn blue" id="btn-reset">复位视角</button>
        <button class="btn cyan" id="btn-hide">隐藏</button>
        <button class="btn orange" id="btn-rotate">旋转</button>
        <button class="btn purple" id="btn-qrcode">生成访问二维码</button>
        <button class="btn orange" id="btn-anim">播放动画</button>
    </div>

    <div class="control-block">
        <div>等值面HU阈值:<span id="hu-val">250</span></div>
        <input type="range" id="hu-slider" min="100" max="1200" value="250">
        <button class="btn blue" id="rebuildIsoBtn">重新重建</button>
        <div id="status-text">等待上传DICOM</div>
        <div id="log-text" style="margin-top:8px;font-size:12px;color:#666;"></div>
    </div>
</div>
<div id="viewer-container"></div>

<!-- 修复CDN：使用ESM版本，importmap 解决OrbitControls全局丢失问题 -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// cornerstone 外部umd脚本
await import('https://cdn.jsdelivr.net/npm/cornerstone@7.2.8/dist/cornerstone.min.js');
await import('https://cdn.jsdelivr.net/npm/cornerstone-wado-image-loader@4.13.2/dist/cornerstoneWADOImageLoader.bundle.min.js');

// ---------------------- 内置简易Marching Cubes ----------------------
class MarchingCubesHelper {
    static createIsoSurface(voxelData, dimX, dimY, dimZ, isoValue) {
        const geometry = new THREE.BufferGeometry();
        const vertices = [];

        for(let z=0; z<dimZ-1; z++){
            for(let y=0; y<dimY-1; y++){
                for(let x=0; x<dimX-1; x++){
                    const idx0 = z*dimX*dimY + y*dimX + x;
                    const v0 = voxelData[idx0];
                    const v1 = voxelData[idx0+1];
                    const v2 = voxelData[idx0 + dimX];
                    const v3 = voxelData[idx0 + dimX +1];
                    const v4 = voxelData[idx0 + dimX*dimY];
                    const v5 = voxelData[idx0 + dimX*dimY +1];
                    const v6 = voxelData[idx0 + dimX*dimY + dimX];
                    const v7 = voxelData[idx0 + dimX*dimY + dimX +1];

                    const cubeValues = [v0,v1,v3,v2,v4,v5,v7,v6];
                    let insideCount = 0;
                    cubeValues.forEach(v=>{ if(v>isoValue) insideCount++; });
                    if(insideCount>0 && insideCount<8){
                        const sx = x, sy=y, sz=z;
                        vertices.push(
                            sx, sy, sz,
                            sx+1, sy, sz,
                            sx, sy+1, sz,
                            sx+1, sy+1, sz,
                            sx, sy, sz+1,
                            sx+1, sy, sz+1,
                            sx, sy+1, sz+1,
                            sx+1, sy+1, sz+1
                        );
                    }
                }
            }
        }
        geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices,3));
        geometry.computeVertexNormals();
        return geometry;
    }
}

// 全局变量
let scene, camera, renderer, controls;
let dicomVolume = null;
let volumeMesh = null;
let rotateAnim = false;
const statusText = document.getElementById('status-text');
const logText = document.getElementById('log-text');
const huSlider = document.getElementById('hu-slider');
const huValSpan = document.getElementById('hu-val');

// three初始化
function initThree(){
    const container = document.getElementById('viewer-container');
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0xeeeeee);
    camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1,5000);
    camera.position.set(120,120,180);

    renderer = new THREE.WebGLRenderer({antialias:true});
    renderer.setSize(container.clientWidth, container.clientHeight);
    container.appendChild(renderer.domElement);

    controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    const light1 = new THREE.DirectionalLight(0xffffff, 1);
    light1.position.set(100,100,100);
    scene.add(light1);
    scene.add(new THREE.AmbientLight(0xffffff,0.4));

    window.addEventListener('resize',()=>{
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
    });

    function animate(){
        requestAnimationFrame(animate);
        if(rotateAnim && volumeMesh){
            volumeMesh.rotation.y +=0.005;
        }
        controls.update();
        renderer.render(scene,camera);
    }
    animate();
}

// cornerstone初始化
function initCornerstone(){
    cornerstoneWADOImageLoader.external.cornerstone = cornerstone;
    cornerstoneWADOImageLoader.configure({useWebWorkers:false});
}

// UI事件
document.getElementById('btn-upload').onclick = ()=>{
    document.getElementById('file-input').click();
};

document.getElementById('file-input').onchange = async (e)=>{
    statusText.innerText = "正在解析DICOM...";
    const files = Array.from(e.target.files);
    const volumeVoxels = [];
    let dimX=null,dimY=null;
    let validFileCount=0;
    logText.innerText='';

    for(const f of files){
        try{
            const arrayBuf = await f.arrayBuffer();
            const image = await cornerstoneWADOImageLoader.createImage(arrayBuf);
            dimX = image.width;
            dimY = image.height;
            const pxData = image.getPixelData();
            if(!pxData) continue;
            validFileCount++;
            for(let i=0;i<pxData.length;i++){
                volumeVoxels.push(pxData[i]);
            }
        }catch(err){
            logText.innerText += `跳过文件:${f.name}\n`;
            console.warn('跳过无效dcm',f.name,err);
        }
    }

    if(validFileCount===0){
        statusText.innerText = "没有读到有效DICOM图像！";
        alert("选中的文件全部不含像素图像，请选择CT切片dcm，不要选报告/结构化dcm");
        return;
    }

    dicomVolume = {
        data: new Float32Array(volumeVoxels),
        width: dimX,
        height: dimY,
        depth: validFileCount
    };
    statusText.innerText = `加载完成: ${dimX}×${dimY}×${validFileCount}`;
};

huSlider.oninput = ()=>{
    huValSpan.innerText = huSlider.value;
};

// 重建按钮
document.getElementById('rebuildIsoBtn').onclick = async ()=>{
    if(!dicomVolume){
        alert("请先上传DICOM序列");
        return;
    }
    statusText.innerText = "正在执行Marching‑Cubes";
    const isoThresh = Number(huSlider.value);
    if(volumeMesh) scene.remove(volumeMesh);

    const geo = MarchingCubesHelper.createIsoSurface(
        dicomVolume.data,
        dicomVolume.width,
        dicomVolume.height,
        dicomVolume.depth,
        isoThresh
    );
    const mat = new THREE.MeshPhongMaterial({color:0xcccccc});
    volumeMesh = new THREE.Mesh(geo, mat);
    scene.add(volumeMesh);
    const vertCount = geo.attributes.position?.count ?? 0;
    statusText.innerText = `重建完成，顶点:${vertCount}`;
    console.log("顶点数量:",vertCount);
};

document.getElementById('btn-reset').onclick = ()=>{
    camera.position.set(120,120,180);
    controls.reset();
};
document.getElementById('btn-hide').onclick = ()=>{
    if(volumeMesh) volumeMesh.visible = !volumeMesh.visible;
};
document.getElementById('btn-rotate').onclick = ()=>{
    rotateAnim = !rotateAnim;
};

initThree();
initCornerstone();
</script>
</body>
</html>
